        <div class="field" style="margin-top:14px"><label>Custom image</label>
          <label class="file-btn" id="fileLbl"><input type="file" id="sBgI" accept="image/*"><span id="fileTxt">📁 ${s.bgImage?'Change image':'Choose an image'}</span></label></div>
        <div class="set-grid" style="margin-top:4px">
          <div class="field"><label>Blur <span class="val" id="vBlur"></span></label><input type="range" id="sBlur" min="0" max="30" value="${s.bgBlur}"></div>
          <div class="field"><label>Darkness <span class="val" id="vDim"></span></label><input type="range" id="sDim" min="0" max="90" value="${s.bgDim}"></div>
        </div>
        <div class="hint">The background fills the whole app. Blur is clipped to the screen, so it never spills off the edges.</div>
      </div>
    </div>

    <div data-p="ui" class="hidden">
      <div class="set-card">
        <div class="section-h" style="margin-top:0">Interface glass</div>
        <div class="field"><label>UI opacity <span class="val" id="vUiO"></span></label><input type="range" id="sUiO" min="10" max="100" value="${s.uiOpacity??72}"></div>
        <div class="field"><label>UI blur (frosted glass) <span class="val" id="vUiB"></span></label><input type="range" id="sUiB" min="0" max="30" value="${s.uiBlur??14}"></div>
        <div class="hint">Lower opacity lets your custom background show through panels, the sidebar and the top bar.</div>
      </div>
      <div class="set-card">
        <div class="section-h" style="margin-top:0">Scrolling</div>
        <div class="field" style="margin-bottom:0"><label style="justify-content:flex-start;gap:8px"><input type="checkbox" id="sAutoScroll" ${s.autoScrollBottom!==false?'checked':''}> Auto-scroll to the newest message</label></div>
        <div class="hint">Jumps you to the bottom when you open a chat and whenever a new message arrives. Turn off to stay where you're reading.</div>
      </div>
    </div>

    <div data-p="ping" class="hidden">
      <div class="set-card">
        <div class="field"><label style="justify-content:flex-start;gap:8px"><input type="checkbox" id="sPe" ${s.pings.everyone?'checked':''}> Receive @everyone pings</label></div>
        <div class="field" style="margin-bottom:0"><label style="justify-content:flex-start;gap:8px"><input type="checkbox" id="sPs" ${s.pings.sound?'checked':''}> Play sound on ping</label></div>
      </div>
    </div>

    <div class="err" id="sErr"></div>
    <div class="actions">
      <button class="btn sec" id="sReset">Reset</button>
      <button class="btn sec" id="sCancel">Cancel</button>
      <button class="btn" id="sSave">Save</button>
    </div></div></div>`;
  const $$=id=>root.querySelector(id);
  $('#sTabs') && root.querySelectorAll('#sTabs button').forEach(b=>b.onclick=()=>{
    root.querySelectorAll('#sTabs button').forEach(x=>x.classList.toggle('active',x===b));
    root.querySelectorAll('[data-p]').forEach(p=>p.classList.toggle('hidden',p.dataset.p!==b.dataset.t));
  });
  function read(){
    s.meBubble=$$('#sMe').value;s.meText=$$('#sMeT').value;
    s.radius=+$$('#sRad').value;s.font=$$('#sFont').value;s.size=+$$('#sSize').value;
    s.bold=$$('#sBold').checked;s.italic=$$('#sItal').checked;
    s.bgType=$$('#sBgT').value;s.bgColor=$$('#sBg1').value;s.bgColor2=$$('#sBg2').value;
    s.bgFit=$$('#sBgFit').value;
    s.bgBlur=+$$('#sBlur').value;s.bgDim=+$$('#sDim').value;
    s.uiOpacity=+$$('#sUiO').value;s.uiBlur=+$$('#sUiB').value;
    s.autoScrollBottom=$$('#sAutoScroll').checked;
    s.pings={everyone:$$('#sPe').checked,sound:$$('#sPs').checked,desktop:false};
  }
  function readouts(){
    $$('#vRad').textContent=s.radius+'px';$$('#vSize').textContent=s.size+'px';
    $$('#vBlur').textContent=s.bgBlur+'px';$$('#vDim').textContent=s.bgDim+'%';
    $$('#vUiO').textContent=s.uiOpacity+'%';$$('#vUiB').textContent=s.uiBlur+'px';
  }
  function preview(){
    read();readouts();
    applyStyle($$('#pvBox'),s);
    paintBg($$('#pvBg'),$$('#pvDim'),s);
    // live-preview the real app too, so background/glass changes are visible behind the modal
    applyStyle(document.documentElement,s);
  }
  root.querySelectorAll('input,select').forEach(i=>i.addEventListener('input',preview));
  $$('#sBgI').onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    $$('#fileTxt').textContent='⏳ Processing...';
    try{
      s.bgImage=await compressImage(f,1920,.8);
      s.bgType='image';$$('#sBgT').value='image';
      $$('#fileTxt').textContent='✅ '+f.name;
    }catch(_){$$('#fileTxt').textContent='❌ Could not load that image'}
    preview();
  };
  const closeRevert=()=>{root.innerHTML='';applyStyle(document.documentElement,ME.settings)};
  $$('#sCancel').onclick=closeRevert;
  $$('#sReset').onclick=()=>{
    Object.assign(s,{meBubble:'#7c6cff',meText:'#ffffff',radius:16,font:'system',size:15,bold:false,italic:false,bgType:'none',bgImage:'',bgFit:'cover',bgBlur:0,bgDim:30,uiOpacity:72,uiBlur:14,autoScrollBottom:true,pings:{everyone:true,sound:true,desktop:false}});
    root.innerHTML='';
    DB.updateSettings(ME.id,s).catch(()=>{});
    ME=DB.currentUser();applyStyle(document.documentElement,s);toast('Settings reset.');
  };
  $$('#sSave').onclick=async()=>{
    read();
    const b=$$('#sSave');b.disabled=true;b.textContent='Saving...';
    try{
      await DB.updateSettings(ME.id,s);
      ME=DB.currentUser();root.innerHTML='';applyStyle(document.documentElement,ME.settings);toast('Saved!');
    }catch(e){
      b.disabled=false;b.textContent='Save';
      $$('#sErr').textContent='Could not save: '+(e.code||e.message)+(/PERMISSION/i.test(e.code||e.message)?' — publish the updated database rules.':'');
    }
  };
  preview();
}

/* ---------- Account (username change) ---------- */
function openAccount(){
  ME=DB.currentUser();
  const wait=ME.lastNameChange+CFG.NAME_CHANGE_MS-Date.now();
  const can=wait<=0;
  $('#modalRoot').innerHTML=`<div class="modal-bg"><div class="modal">
    <h2>👤 Account</h2>
    <div class="hint">User ID: <b>#${ME.id}</b> · Sign-in: ${ME.provider} ${ME.email?'· '+esc(ME.email):''}</div>
    <div class="section-h">Change username</div>
    <div class="field"><label>New username (1-20 chars: 0-9 a-z A-Z . _ -)</label><input id="acName" maxlength="20" value="${esc(ME.username)}"></div>
    <div class="hint">${can?'You can change your username now (once every 7 days).':`Next change available in ${Math.ceil(wait/86400000)} day(s).`}</div>
    <div class="err" id="acErr"></div>
    <div class="actions"><button class="btn sec" id="acClose">Close</button><button class="btn" id="acSave">Save</button></div>
    ${ME.provider==='google'&&!DB.hasPasswordLogin()?`
    <div class="section-h">Sign in with a password too</div>
    <div class="hint">Add a password so you can also log in with your username instead of Google.</div>
    <div class="field" style="margin-top:10px"><label>New password</label><input id="acPw" type="password" autocomplete="new-password"></div>
    <div class="err" id="acPwErr"></div>
    <div class="actions"><button class="btn" id="acPwSave">Set Password</button></div>`:''}
  </div></div>`;
  $('#acClose').onclick=()=>$('#modalRoot').innerHTML='';
  $('#acSave').onclick=async()=>{
    const b=$('#acSave');b.disabled=true;$('#acErr').textContent='';
    try{
      const nv=$('#acName').value.trim();
      const before=ME.username;
      await DB.renameUser(ME.id,nv);
      ME=DB.currentUser();
      if(ME.username===before){b.disabled=false;$('#modalRoot').innerHTML='';return}
      $('#modalRoot').innerHTML=`<div class="modal-bg"><div class="modal" style="max-width:380px;text-align:center">
        <div style="font-size:42px;margin-bottom:6px">✅</div><h2>Username changed</h2>
        <div class="hint">You're now <b style="color:var(--text)">${esc(ME.username)}</b>. Refreshing in 1 second...</div></div></div>`;
      setTimeout(()=>location.reload(),1000);
    }catch(e){b.disabled=false;$('#acErr').textContent=e.message}
  };
  if($('#acPwSave'))$('#acPwSave').onclick=async()=>{
    try{
      await DB.setPassword($('#acPw').value);
      toast('Password set. You can now sign in with your username too.');
      $('#modalRoot').innerHTML='';
    }catch(e){$('#acPwErr').textContent=e.message}
  };
}

/* ---------- Rooms modals ---------- */
function modalCreateRoom(){
  $('#modalRoot').innerHTML=`<div class="modal-bg"><div class="modal"><h2>Create a room</h2>
    <div class="field"><label>Room name</label><input id="rmName" maxlength="30"></div>
    <div class="err" id="rmErr"></div>
    <div class="actions"><button class="btn sec" id="rmX">Cancel</button><button class="btn" id="rmOk">Create</button></div></div></div>`;
  $('#rmX').onclick=()=>$('#modalRoot').innerHTML='';
  $('#rmOk').onclick=async()=>{
    try{const r=await DB.createRoom(ME.id,$('#rmName').value);$('#modalRoot').innerHTML='';selectRoom(r.id);toast(`Room created. Share code: ${r.code}`)}
    catch(e){$('#rmErr').textContent=e.message}
  };
}
function modalJoinRoom(){
  $('#modalRoot').innerHTML=`<div class="modal-bg"><div class="modal"><h2>Join a room</h2>
    <div class="field"><label>Room code</label><input id="jrCode" maxlength="6" style="text-transform:uppercase"></div>
    <div class="err" id="jrErr"></div>
    <div class="actions"><button class="btn sec" id="jrX">Cancel</button><button class="btn" id="jrOk">Join</button></div></div></div>`;
  $('#jrX').onclick=()=>$('#modalRoot').innerHTML='';
  $('#jrOk').onclick=async()=>{
    try{const r=await DB.joinRoom(ME.id,$('#jrCode').value);$('#modalRoot').innerHTML='';selectRoom(r.id)}
    catch(e){$('#jrErr').textContent=e.message}
  };
}

/* ---------- Friends ---------- */
let friendTab='friends';
function modalAddFriend(){
  ME=DB.currentUser();
  $('#modalRoot').innerHTML=`<div class="modal-bg"><div class="modal"><h2>Find people</h2>
    <div class="field"><label>Search by username or user ID</label><input id="afQ" placeholder="e.g. alex or 42" autocomplete="off"></div>
    <div id="afResults"><div class="hint">Start typing to search.</div></div>
    <div class="actions"><button class="btn sec" id="afX">Close</button></div></div></div>`;
  $('#afX').onclick=()=>$('#modalRoot').innerHTML='';
  const q=$('#afQ');
  q.addEventListener('input',()=>renderAfResults(q.value.trim()));
  q.focus();
}
function renderAfResults(v){
  const box=$('#afResults');if(!box)return;
  if(!v){box.innerHTML='<div class="hint">Start typing to search.</div>';return}
  // A numeric query could be either a user ID lookup OR a username that
  // happens to be all digits (usernames allow 0-9) — search both and merge,
  // instead of treating "all digits" as exclusively an ID search.
  const byName=DB.allUsers().filter(u=>u.username.toLowerCase().includes(v.toLowerCase()));
  let matches=byName;
  if(/^[0-9]+$/.test(v)){
    const byId=DB.getUser(Number(v));
    if(byId&&!byName.some(u=>u.id===byId.id))matches=[byId,...byName];
  }
  matches=matches.filter(u=>u.id!==ME.id).slice(0,8);
  if(!matches.length){box.innerHTML='<div class="empty">No users found.</div>';return}
  box.innerHTML='';
  matches.forEach(u=>{
    const isFriend=ME.friends.includes(u.id);
    const sentReq=DB.hasOutgoing(ME.id,u.id);
    const d=document.createElement('div');d.className='list-row';
    d.innerHTML=`<div class="avatar">${esc(u.username[0].toUpperCase())}</div><div class="nm">${esc(u.username)} <span class="hint">#${u.id}</span></div>`;
    const btn=document.createElement('button');btn.className='btn small';
    if(isFriend){
      btn.textContent='Message';
      btn.onclick=()=>{$('#modalRoot').innerHTML='';view.dmView='chat';view.mode='dms';selectRoom(DB.dmKey(ME.id,u.id))};
    }else if(sentReq){
      btn.textContent='Requested';btn.disabled=true;btn.className+=' sec';
    }else{
      btn.textContent='Add Friend';
      btn.onclick=async()=>{
        if(btn.disabled)return;
        btn.disabled=true;
        try{
          const r=await DB.friendReqById(ME.id,u.id);
          toast(r==='accepted'?'You are now friends!':'Friend request sent.');
          ME=DB.currentUser();renderAfResults(v);
        }catch(e){btn.disabled=false;toast(e.message,'bad')}
      };
    }
    d.appendChild(btn);box.appendChild(d);
  });
}
function renderFriends(){
  const box=$('#messages');ME=DB.currentUser();
  const inc=DB.incoming(ME.id),out=DB.outgoing(ME.id);
  box.innerHTML=`<div style="max-width:640px;width:100%;margin:0 auto" id="frWrap">
    <div class="tab-mini">
      <button data-t="friends" class="${friendTab==='friends'?'active':''}">Friends (${ME.friends.length})</button>
      <button data-t="incoming" class="${friendTab==='incoming'?'active':''}">Incoming (${inc.length})</button>
      <button data-t="outgoing" class="${friendTab==='outgoing'?'active':''}">Sent (${out.length})</button>
      <button class="btn small" id="frAdd">+ Add Friend</button>
    </div><div id="frBody"></div></div>`;
  box.querySelectorAll('.tab-mini [data-t]').forEach(b=>b.onclick=()=>{friendTab=b.dataset.t;renderFriends()});
  $('#frAdd').onclick=modalAddFriend;
  const body=$('#frBody');
  const row=(uid,btns)=>{
    const u=DB.getUser(uid)||{id:uid,username:'User '+uid};const d=document.createElement('div');d.className='list-row';
    d.innerHTML=`<div class="avatar">${esc(u.username[0].toUpperCase())}</div><div class="nm">${esc(u.username)} <span class="hint">#${u.id}</span></div>`;
    btns.forEach(([t,cls,fn])=>{const b=document.createElement('button');b.className='btn small '+cls;b.textContent=t;b.onclick=fn;d.appendChild(b)});
    body.appendChild(d);
  };
  if(friendTab==='friends'){
    if(!ME.friends.length)body.innerHTML='<div class="empty">No friends yet. Add someone by username!</div>';
    ME.friends.forEach(f=>row(f,[
      ['Message','',()=>{view.dmView='chat';selectRoom(DB.dmKey(ME.id,f))}],
      ['Remove','danger',()=>{if(confirm('Remove this friend?')){DB.removeFriend(ME.id,f).then(()=>{ME=DB.currentUser();renderChat()})}}]
    ]));
  }else if(friendTab==='incoming'){
    if(!inc.length)body.innerHTML='<div class="empty">No pending requests.</div>';
    inc.forEach(r=>row(r.from,[
      ['Accept','',()=>{DB.acceptFriend(ME.id,r.from).then(()=>{ME=DB.currentUser();renderChat()}).catch(e=>toast(e.message||'Failed','bad'))}],
      ['Decline','sec',()=>{DB.declineFriend(ME.id,r.from).then(renderChat).catch(e=>toast(e.message||'Failed','bad'))}]
    ]));
  }else{
    if(!out.length)body.innerHTML='<div class="empty">No sent requests.</div>';
    out.forEach(r=>row(r.to,[['Cancel','sec',()=>{DB.cancelReq(ME.id,r.to).then(renderChat).catch(e=>toast(e.message||'Failed','bad'))}]]));
  }
}

/* ---------- Live sync (other tabs / future Firestore listeners) ---------- */
DB.onChange(()=>{
  ME=DB.currentUser();
  if(!ME){if(view.page&&view.page!=='authPage'&&!DB.needsProfile()&&!DB.isLoggedIn())show('authPage');return}
  if(view.page==='homePage')refreshBadge();
  applyStyleIfChanged();
  DB.ensureDmMemberships();
  if(view.page==='chatPage'){
    // avoid rebuilding modal/inputs; just refresh lists and messages
    const keepFriends=view.mode==='dms'&&view.dmView==='friends';
    renderChatLight(keepFriends);
  }
});
let _styleSig='';
function applyStyleIfChanged(){
  const s=ME.settings,sig=JSON.stringify([s.meBubble,s.meText,s.radius,s.font,s.size,s.bold,s.italic,s.bgType,s.bgColor,s.bgColor2,s.bgFit,s.bgBlur,s.bgDim,s.uiOpacity,s.uiBlur,s.bgImage&&s.bgImage.length]);
  if(sig!==_styleSig){_styleSig=sig;
    // don't clobber a live settings preview
    if(!document.querySelector('#sTabs'))applyStyle(document.documentElement,s)}
}
function renderChatLight(keepFriends){
  ME=DB.currentUser();
  if(keepFriends){renderChat();return}
  // rebuild sidebar and messages without touching composer text
  const draft=msgIn.value,ss=msgIn.selectionStart;
  renderChat();
  msgIn.value=draft;try{msgIn.setSelectionRange(ss,ss)}catch(e){}
}

/* ---------- Boot ---------- */
(async function init(){
  let settled=false;
  DB.settle().then(()=>settled=true);
  setTimeout(()=>{
    if(settled||view.page!=='loadingPage')return;
    $('#loadingHint').textContent="This is taking longer than expected. Check your connection.";
    $('#loadingRetry').classList.remove('hidden');
  },10000);
  $('#loadingRetry').onclick=()=>location.reload();
  await DB.settle();
  ME=DB.currentUser();
  if(ME){applyStyle(document.documentElement,ME.settings);goHome()}
  else if(DB.hadSessionError()){
    // couldn't confirm the account (network) — do NOT ask for a username; offer a reload instead
    show('loadingPage');$('.spinner').classList.add('hidden');
    $('#loadingHint').textContent="Couldn't reach the server to load your account.";
    $('#loadingRetry').classList.remove('hidden');
  }
  else if(DB.needsProfile()){show('authPage');modalPickUsername()}
  else show('authPage');
})();
</script>
