<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Bump this string every time you edit and re-publish this file. Connected
     clients poll for a change here and auto-refresh once a new version is live,
     so nobody stays on stale code after a deploy. -->
<meta name="build-version" content="2026-09-20.1">
<title>Itsuki Chat</title>
<style>
:root{
  --bg:#0b0c1a; --bg2:#14152b; --panel:#1a1c38; --panel2:#23264a;
  --text:#eef0ff; --muted:#9a9dc4; --accent:#7c6cff; --accent2:#ff6cb4;
  --danger:#ff5d73; --ok:#4cd6a0; --border:rgba(255,255,255,.09);
  --radius:16px;
  --ui-alpha:.72;            /* UI transparency (customizable) */
  --ui-blur:14px;
  --ui-panel:rgba(26,28,56,var(--ui-alpha));
  --ui-panel2:rgba(35,38,74,var(--ui-alpha));
  --ui-bg2:rgba(20,21,43,calc(var(--ui-alpha) + .1));
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;color:inherit}
input,textarea,select{font-family:inherit;color:var(--text)}
.hidden{display:none!important}

/* ===== Pretty scrollbars ===== */
*{scrollbar-width:thin;scrollbar-color:rgba(124,108,255,.45) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(124,108,255,.35);border-radius:10px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:rgba(124,108,255,.65);border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-corner{background:transparent}

.page{position:absolute;inset:0;display:flex;flex-direction:column;animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.spinner{width:40px;height:40px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loadingPage{align-items:center;justify-content:center}

/* ===== FULL-SCREEN BACKGROUND (fixed, always fills the entire viewport, blur clipped inside) ===== */
.bgfx{position:fixed;inset:0;z-index:-2;overflow:hidden;background:
  radial-gradient(900px 500px at 10% 0%,rgba(124,108,255,.28),transparent 60%),
  radial-gradient(800px 500px at 100% 100%,rgba(255,108,180,.2),transparent 60%),var(--bg)}
.bgfx .layer{position:absolute;inset:-60px;background-size:cover;background-position:center;background-repeat:no-repeat;transform:translateZ(0)}
.bgfx .dim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}

.btn{background:linear-gradient(135deg,var(--accent),#5a4bff);padding:11px 20px;border-radius:12px;font-weight:600;transition:.15s;box-shadow:0 6px 18px rgba(124,108,255,.28);font-size:14px}
.btn:hover{transform:translateY(-1px);filter:brightness(1.1)}
.btn:active{transform:none}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn.sec{background:var(--ui-panel2);border:1px solid var(--border);box-shadow:none}
.btn.danger{background:var(--danger);box-shadow:none}
.btn.small{padding:7px 13px;font-size:13px;border-radius:10px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.field label .val{color:var(--text);font-weight:700;background:rgba(124,108,255,.18);padding:1px 8px;border-radius:20px;font-size:12px}
.field input,.field select,.field textarea{background:var(--ui-bg2);border:1px solid var(--border);padding:11px 13px;border-radius:12px;outline:none;font-size:14px;transition:.15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,108,255,.18)}
.err{color:var(--danger);font-size:13px;min-height:18px;margin-bottom:8px}
.hint{color:var(--muted);font-size:12px;line-height:1.5}

/* ===== AUTH ===== */
#authPage{align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.card{background:var(--ui-panel);backdrop-filter:blur(var(--ui-blur));-webkit-backdrop-filter:blur(var(--ui-blur));border:1px solid var(--border);border-radius:24px;padding:34px;width:100%;max-width:430px;margin:auto;box-shadow:0 24px 70px rgba(0,0,0,.45)}
.logo{font-size:30px;font-weight:800;letter-spacing:-.02em;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:4px}
.card .logo,.card>.hint{text-align:center}
.tabs{display:flex;gap:6px;background:var(--ui-bg2);padding:5px;border-radius:14px;margin:20px 0}
.tabs button{flex:1;padding:10px;border-radius:10px;background:transparent;color:var(--muted);font-weight:600;transition:.15s}
.tabs button.active{background:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(124,108,255,.35)}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:16px 0}
.divider:before,.divider:after{content:"";flex:1;height:1px;background:var(--border)}

/* ===== HOME (fully centered) ===== */
#homePage{align-items:center;justify-content:center;padding:24px;overflow-y:auto}
.home-wrap{max-width:820px;width:100%;margin:auto;display:flex;flex-direction:column;align-items:center;text-align:center}
.home-head{position:absolute;top:20px;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:0 24px}
.userchip{display:flex;align-items:center;gap:10px;background:var(--ui-panel);backdrop-filter:blur(var(--ui-blur));-webkit-backdrop-filter:blur(var(--ui-blur));border:1px solid var(--border);padding:7px 16px 7px 7px;border-radius:40px;cursor:pointer;transition:.15s;font-weight:600;font-size:14px}
.userchip:hover{border-color:var(--accent);transform:translateY(-1px)}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none;color:#fff}
.home-hero{margin-bottom:38px}
.home-hero .logo{font-size:54px;margin-bottom:14px}
.home-title{font-size:26px;font-weight:700;margin-bottom:6px}
.home-sub{color:var(--muted);font-size:15px}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;width:100%;max-width:640px}
.home-foot{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:30px}
.online-pill{display:flex;align-items:center;gap:8px;background:var(--ui-panel);backdrop-filter:blur(var(--ui-blur));-webkit-backdrop-filter:blur(var(--ui-blur));border:1px solid var(--border);padding:8px 16px;border-radius:40px;font-size:13px;color:var(--muted);font-weight:600}
.online-pill .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.discord-link{display:flex;align-items:center;gap:8px;background:#5865F2;color:#fff;padding:8px 18px;border-radius:40px;font-size:13px;font-weight:700;text-decoration:none;transition:.15s;box-shadow:0 6px 18px rgba(88,101,242,.35)}
.discord-link:hover{transform:translateY(-1px);filter:brightness(1.08)}
.opt{background:var(--ui-panel);backdrop-filter:blur(var(--ui-blur));-webkit-backdrop-filter:blur(var(--ui-blur));border:1px solid var(--border);border-radius:22px;padding:30px 22px;display:flex;flex-direction:column;align-items:center;text-align:center;transition:.22s;position:relative;overflow:hidden}
.opt:before{content:"";position:absolute;inset:0;background:radial-gradient(400px 160px at 50% -20%,rgba(124,108,255,.28),transparent 70%);opacity:0;transition:.25s}
.opt:hover{transform:translateY(-5px);border-color:rgba(124,108,255,.7);box-shadow:0 16px 40px rgba(124,108,255,.28)}
.opt:hover:before{opacity:1}
.opt .ic{font-size:38px;margin-bottom:12px;width:70px;height:70px;display:flex;align-items:center;justify-content:center;background:rgba(124,108,255,.14);border-radius:20px;position:relative}
.opt h3{font-size:18px;margin-bottom:4px;position:relative}
.opt p{color:var(--muted);font-size:13px;position:relative}
.opt .badge{position:absolute;top:14px;right:14px}
.badge{background:var(--accent2);color:#fff;border-radius:20px;font-size:11px;font-weight:700;padding:2px 8px}

/* ===== CHAT LAYOUT ===== */
.chat-layout{display:flex;height:100%}
.sidebar{width:280px;background:var(--ui-panel);backdrop-filter:blur(var(--ui-blur));-webkit-backdrop-filter:blur(var(--ui-blur));border-right:1px solid var(--border);display:flex;flex-direction:column;flex:none}
.sb-head{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.sb-head .back{background:var(--ui-panel2);width:36px;height:36px;border-radius:11px;font-size:16px;transition:.15s}
.sb-head .back:hover{background:var(--accent)}
.sb-title{font-weight:700}
.sb-list{flex:1;overflow-y:auto;padding:10px}
.sb-section{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:14px 8px 6px;display:flex;justify-content:space-between;align-items:center}
.sb-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;cursor:pointer;color:var(--muted);transition:.12s;margin-bottom:2px}
.sb-item:hover{background:var(--ui-panel2);color:var(--text)}
.sb-item.active{background:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(124,108,255,.3)}
.sb-item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-foot{padding:12px;border-top:1px solid var(--border);display:flex;gap:8px}
.sb-foot .btn{flex:1}
.main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.topbar{position:relative;z-index:2;padding:14px 20px;border-bottom:1px solid var(--border);background:var(--ui-panel);backdrop-filter:blur(var(--ui-blur));-webkit-backdrop-filter:blur(var(--ui-blur));display:flex;align-items:center;gap:12px}
.topbar h2{font-size:16px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu-btn{display:none;background:var(--ui-panel2);width:36px;height:36px;border-radius:10px}
.messages{position:relative;z-index:1;flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:6px}
.msg{display:flex;gap:10px;max-width:78%;align-items:flex-end;animation:msgIn .18s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg .meta{font-size:11px;color:var(--muted);margin:0 6px 3px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.msg.me .meta{text-align:right}
.bubble{padding:9px 14px;border-radius:var(--b-radius,16px);background:var(--b-other,var(--panel2));color:var(--b-other-text,var(--text));font-family:var(--m-font,inherit);font-size:var(--m-size,15px);font-weight:var(--m-weight,400);font-style:var(--m-style,normal);word-wrap:break-word;overflow-wrap:anywhere;white-space:pre-wrap;line-height:1.4;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.msg.me .bubble{background:var(--b-me,linear-gradient(135deg,var(--accent),#5a4bff));color:var(--b-me-text,#fff)}
.bubble.pinged{outline:2px solid var(--accent2);box-shadow:0 0 14px rgba(255,108,180,.5)}
.mention{background:rgba(255,108,180,.25);color:#ffd0e8;padding:0 4px;border-radius:5px;font-weight:600}
.mention.me{background:var(--accent2);color:#fff}
.mention.everyone{background:#ffb84d;color:#3a2400}
.sys{align-self:center;color:var(--muted);font-size:12px;padding:5px 12px;background:var(--ui-panel);border-radius:20px}
.date-sep{align-self:center;color:var(--muted);font-size:11px;margin:8px 0;background:var(--ui-panel);padding:3px 12px;border-radius:20px}

/* Images in messages */
.imgs{display:grid;gap:3px;margin-top:6px;border-radius:12px;overflow:hidden;max-width:340px}
.imgs.n1{grid-template-columns:1fr;max-width:300px}
.imgs.n2{grid-template-columns:1fr 1fr}
.imgs.n3{grid-template-columns:1fr 1fr}
.imgs.n3 img:first-child{grid-column:span 2}
.imgs.n4{grid-template-columns:1fr 1fr}
.imgs.multi{grid-template-columns:repeat(3,1fr)}
.imgs img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;display:block;background:var(--bg2)}
.imgs.n1 img{max-height:320px;height:auto;object-fit:contain}
.imgs:not(.n1) img{aspect-ratio:1;}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:1000;display:flex;align-items:center;justify-content:center}
.lightbox img{max-width:92vw;max-height:88vh;border-radius:8px}
.lb-btn{position:absolute;background:rgba(255,255,255,.12);color:#fff;width:44px;height:44px;border-radius:50%;font-size:20px}
.lb-close{top:20px;right:20px}.lb-prev{left:20px;top:50%}.lb-next{right:20px;top:50%}
.lb-count{position:absolute;bottom:20px;color:#fff;font-size:13px}

/* Composer */
.composer{position:relative;z-index:2;padding:12px 16px;border-top:1px solid var(--border);background:var(--ui-panel);backdrop-filter:blur(var(--ui-blur));-webkit-backdrop-filter:blur(var(--ui-blur))}
.previews{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.pv{position:relative;width:64px;height:64px;border-radius:10px;overflow:hidden;border:1px solid var(--border)}
.pv img{width:100%;height:100%;object-fit:cover}
.pv button{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.7);font-size:11px;line-height:1}
.row{display:flex;gap:8px;align-items:flex-end}
.row textarea{flex:1;background:var(--ui-bg2);border:1px solid var(--border);border-radius:14px;padding:11px 14px;outline:none;resize:none;max-height:140px;font-size:14px;transition:.15s}
.row textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,108,255,.18)}
.icon-btn{background:var(--ui-panel2);border:1px solid var(--border);width:42px;height:42px;border-radius:13px;font-size:18px;flex:none;transition:.15s}
.icon-btn:hover{border-color:var(--accent)}
.send{background:linear-gradient(135deg,var(--accent),#5a4bff);width:42px;height:42px;border-radius:13px;flex:none;font-size:18px;box-shadow:0 4px 14px rgba(124,108,255,.35)}
.mention-pop{position:absolute;bottom:100%;left:16px;background:var(--panel);border:1px solid var(--border);border-radius:12px;min-width:220px;max-height:220px;overflow-y:auto;box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:5}
.mention-pop div{padding:9px 14px;cursor:pointer;display:flex;gap:8px;align-items:center;font-size:14px}
.mention-pop div:hover,.mention-pop div.sel{background:var(--accent)}
.charcount{font-size:11px;color:var(--muted);text-align:right;margin-top:3px}

/* ===== Modals ===== */
.modal-bg{position:fixed;inset:0;background:rgba(5,5,15,.62);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .2s ease}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:22px;padding:28px;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;animation:modalIn .22s cubic-bezier(.2,.8,.3,1);box-shadow:0 30px 80px rgba(0,0,0,.55)}
@keyframes modalIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.modal h2{margin-bottom:6px;font-size:22px}
.modal .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.modal.wide .actions{position:sticky;bottom:-28px;margin:16px -28px -28px;padding:14px 28px;background:linear-gradient(to top,var(--panel) 70%,transparent);border-radius:0 0 22px 22px;z-index:3}
.modal.wide .preview-box{position:sticky;top:-28px;z-index:3;margin-top:8px}
.set-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.preview-box{position:relative;overflow:hidden;background:var(--bg2);border-radius:16px;padding:16px;margin:12px 0 18px;min-height:130px;border:1px solid var(--border);isolation:isolate}
.preview-box .pv-bg{position:absolute;inset:-30px;z-index:-2;background-size:cover;background-position:center}
.preview-box .pv-dim{position:absolute;inset:0;z-index:-1;background:#000}
.preview-box .msg{max-width:100%;margin-bottom:8px}
input[type=color]{padding:3px;height:42px;cursor:pointer;width:100%}
input[type=range]{padding:0;accent-color:var(--accent);height:6px;cursor:pointer}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
.section-h{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin:18px 0 10px;font-weight:700}
.set-card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px}
.set-card .set-grid{margin-bottom:0}
.set-card .field:last-child{margin-bottom:0}
.modal.wide{max-width:640px}
.modal-tabs{display:flex;gap:6px;background:var(--bg2);padding:5px;border-radius:14px;margin:14px 0}
.modal-tabs button{flex:1;padding:9px;border-radius:10px;background:transparent;color:var(--muted);font-weight:600;font-size:13px}
.modal-tabs button.active{background:var(--accent);color:#fff}
.file-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:11px;border:1px dashed rgba(124,108,255,.5);border-radius:12px;cursor:pointer;color:var(--muted);font-size:13px;transition:.15s;background:var(--ui-bg2)}
.file-btn:hover{border-color:var(--accent);color:var(--text)}
.file-btn input{display:none}

/* Friends */
.list-row{display:flex;align-items:center;gap:10px;padding:11px;border-radius:14px;background:var(--ui-panel);border:1px solid var(--border);margin-bottom:8px}
.modal .list-row{background:var(--bg2)}
.list-row .nm{flex:1}
.tab-mini{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.tab-mini button{background:var(--ui-panel);padding:8px 14px;border-radius:10px;font-size:13px;color:var(--muted);border:1px solid var(--border)}
.tab-mini button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.empty{color:var(--muted);text-align:center;padding:40px 20px;font-size:14px;background:var(--ui-panel);border-radius:16px}
.toast-wrap{position:fixed;top:18px;right:18px;z-index:2000;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--panel2);border:1px solid var(--border);border-left:4px solid var(--accent);padding:12px 16px;border-radius:12px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:slide .25s}
.toast.ping{border-left-color:var(--accent2)}
.toast.bad{border-left-color:var(--danger)}
@keyframes slide{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.tag{font-size:10px;background:var(--accent2);color:#fff;padding:1px 6px;border-radius:8px;font-weight:700}
.tag.owner{background:#ffb84d;color:#3a2400}

@media(max-width:760px){
  .sidebar{position:absolute;z-index:20;height:100%;transform:translateX(-100%);transition:.2s;background:var(--panel)}
  .sidebar.open{transform:none}
  .menu-btn{display:block}
  .msg{max-width:92%}
  .set-grid{grid-template-columns:1fr}
  .options{grid-template-columns:1fr 1fr;gap:12px}
  .opt{padding:22px 12px}
  .home-hero .logo{font-size:40px}
}
</style>
</head>
<body>
<div class="bgfx" id="bgfx"><div class="layer" id="bgLayer"></div><div class="dim" id="bgDimEl"></div></div>
<div class="toast-wrap" id="toasts"></div>

<!-- ============ LOADING ============ -->
<div id="loadingPage" class="page">
  <div style="margin:auto;display:flex;flex-direction:column;align-items:center;gap:16px">
    <div class="spinner"></div>
    <div class="logo" style="margin:0">Itsuki Chat</div>
    <div class="hint" id="loadingHint">Connecting...</div>
    <button class="btn sec small hidden" id="loadingRetry">Reload</button>
  </div>
</div>

<!-- ============ AUTH ============ -->
<div id="authPage" class="page hidden">
  <div class="card">
    <div class="logo">Itsuki Chat</div>
    <div class="hint">Chat globally, in rooms, or privately.</div>
    <div class="tabs">
      <button id="tabIn" class="active">Sign In</button>
      <button id="tabUp">Sign Up</button>
    </div>

    <form id="formIn" autocomplete="on">
      <div class="field"><label>Username or Email</label><input id="inId" required autocomplete="username"></div>
      <div class="field"><label>Password</label><input id="inPw" type="password" required autocomplete="current-password"></div>
      <div class="err" id="inErr"></div>
      <button class="btn" style="width:100%" type="submit">Sign In</button>
      <div class="hint" style="margin-top:10px;text-align:center">Trouble signing in with your username? Try your email instead.</div>
    </form>

    <form id="formUp" class="hidden" autocomplete="off">
      <div class="field">
        <label>Username (1-20 chars: 0-9 a-z A-Z . _ -)</label>
        <input id="upUser" maxlength="20" required>
        <span class="hint" id="upUserHint"></span>
      </div>
      <div class="field"><label>Email (optional, lets you sign in with email)</label><input id="upEmail" type="email"></div>
      <div class="field"><label>Password</label><input id="upPw" type="password" required autocomplete="new-password"></div>
      <div class="field"><label>Confirm Password</label><input id="upPw2" type="password" required autocomplete="new-password"></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signInWithPopup,GoogleAuthProvider,signOut as fbSignOut,sendEmailVerification,sendPasswordResetEmail,deleteUser,linkWithCredential,EmailAuthProvider,setPersistence,browserLocalPersistence}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getDatabase,ref,onValue,get,set,update,remove,push,runTransaction,query,orderByChild,limitToLast,serverTimestamp,onDisconnect}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
/* =====================================================================
   ITSUKI CHAT
   Structure:
     1. Config + validation
     2. DB layer (Firebase Realtime Database + Auth)
     3. Auth
     4. UI (pages, chat, settings, friends, rooms)
   Every record is keyed by numeric user ID, never by username.
   ===================================================================== */

/* ---------- 0. Client-side hardening (deterrent layer) ----------
   IMPORTANT: everything in this block can be bypassed by a determined person,
   because the browser belongs to the user. Real protection = the database rules.
   This just raises the effort and reloads the page when tampering is detected. */
(function(){
  const bail=()=>{try{location.reload()}catch(_){}};
  // Block DevTools / view-source shortcuts
  function hit(e){
    const k=(e.key||'').toLowerCase();
    const bad = e.key==='F12' ||
      (e.ctrlKey&&e.shiftKey&&['i','j','c','k','e'].includes(k)) ||   // Chrome/Edge/Firefox panels
      (e.metaKey&&e.altKey&&['i','j','c','u'].includes(k)) ||          // macOS
      (e.ctrlKey&&['u','s'].includes(k));                              // view-source / save page
    if(bad){e.preventDefault();e.stopPropagation();bail();return false}
  }
  window.addEventListener('keydown',hit,true);
  // No right-click menu ("Inspect"), no dragging assets out
  window.addEventListener('contextmenu',e=>{e.preventDefault();bail()},true);
  // Detect docked DevTools by window size gap
  let strikes=0;
  setInterval(()=>{
    const wGap=window.outerWidth-window.innerWidth>160;
    const hGap=window.outerHeight-window.innerHeight>200;
    if(wGap||hGap){if(++strikes>=2)bail()}else strikes=0;
  },1000);
  // Detect DevTools (docked or undocked) via debugger timing:
  // when the inspector is open, `debugger` pauses and the gap becomes large.
  setInterval(()=>{
    const t=performance.now();
    (function(){}).constructor('debugger')();
    if(performance.now()-t>120)bail();
  },1500);
  // Detect DevTools via console getter (fires when the console is open and formats an object)
  const probe=new Image();
  Object.defineProperty(probe,'id',{get(){bail()}});
  setInterval(()=>{console.debug(probe)},2000);
})();

/* ---------- 1. Config + validation ---------- */
const CFG={
  USERNAME_RE:/^[0-9a-zA-Z._-]{1,20}$/,
  NAME_CHANGE_MS:7*24*60*60*1000,
  MAX_IMAGES:10,
  MAX_MSG:2000,
  MAX_IMG_BYTES:8*1024*1024,
  MIN_PW:6,
  GLOBAL_ROOM:'global',
  NUKE_MSGS:3,          // this many messages...
  NUKE_WINDOW_MS:1000   // ...within this window triggers anti-nuke
};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- 2. DB layer (Firebase Realtime Database + Auth) ----------
   Reads are synchronous against a live cache kept fresh by onValue listeners.
   Writes are async and go to Firebase. Security is enforced by the database rules. */
const firebaseConfig={
  apiKey:"AIzaSyCns_X-7DF2aQawb2Q3p4YsoaQmvBMuAgM",
  authDomain:"itsuki-chat.firebaseapp.com",
  databaseURL:"https://itsuki-chat-default-rtdb.firebaseio.com",
  projectId:"itsuki-chat",
  storageBucket:"itsuki-chat.firebasestorage.app",
  messagingSenderId:"1028361304425",
  appId:"1:1028361304425:web:6c21e0fdce02c2bccce5f8"
};
const fbApp=initializeApp(firebaseConfig);
const auth=getAuth(fbApp);
setPersistence(auth,browserLocalPersistence).catch(()=>{}); // survive reloads/new tabs
const rtdb=getDatabase(fbApp);
const R=p=>ref(rtdb,p);
let SKEW=0;
onValue(ref(rtdb,'.info/serverTimeOffset'),s=>{SKEW=Number(s.val())||0});

const DB=(()=>{
  // live cache
  const C={users:{},usernames:{},rooms:{},roomMembers:{},dmMembers:{},friends:{},friendReqIn:{},friendReqOut:{},lastRead:{},messages:{},myRoomIds:[],online:0};
  let myId=null,myUid=null,ready=false;
  const listeners=new Set();
  const unsubs=[];         // base listeners
  let msgUnsub=null,msgKey=null;
  const previewUnsubs={};
  const roomUnsubs={};
  const fetchingUsers=new Set();
  // Fallback: if a user isn't in the live cache yet (e.g. the bulk 'users' listener
  // hasn't synced, or rules restrict it), fetch that one record directly so we
  // don't wrongly show real people as "Deleted User".
  function fetchUserIfMissing(id){
    if(id==null||C.users[id]||fetchingUsers.has(id))return;
    fetchingUsers.add(id);
    get(R('users/'+id)).then(s=>{
      if(s.exists()){C.users[id]=s.val();if(ready)emit()}
    }).catch(()=>{}).finally(()=>fetchingUsers.delete(id));
  }
  const emit=()=>listeners.forEach(f=>{try{f()}catch(e){console.error(e)}});
  const dmKey=(a,b)=>'dm_'+[a,b].sort((x,y)=>x-y).join('_');
  const FAKE='@itsuki.local';

  function listen(path,cb){
    const u=onValue(R(path),s=>{cb(s.val());if(ready)emit()},err=>console.warn('listen denied',path,err.code));
    unsubs.push(u);return u;
  }
  function stopAll(){unsubs.splice(0).forEach(u=>u());Object.keys(previewUnsubs).forEach(k=>{previewUnsubs[k]();delete previewUnsubs[k]});Object.keys(roomUnsubs).forEach(k=>{roomUnsubs[k]();delete roomUnsubs[k]});if(msgUnsub){msgUnsub();msgUnsub=null}msgKey=null}

  function startListeners(){
    stopAll();
    listen('users',v=>C.users=v||{});
    listen('usernames',v=>C.usernames=v||{});
    listen('dmMembers',v=>C.dmMembers=v||{});
    listen('friendRequests/'+myId,v=>C.friendReqIn=v||{});
    listen('lastRead/'+myId,v=>C.lastRead=v||{});
    // Rooms: rather than trying to read the whole 'rooms'/'roomMembers' trees (which
    // security rules almost never allow for a giant shared list), keep a small
    // per-user index of which room IDs I'm in, then watch just those rooms.
    listen('userRooms/'+myId,v=>{
      C.myRoomIds=Object.keys(v||{});
      C.myRoomIds.forEach(watchRoom);
    });
    // watch each friend's DM (latest 30 msgs) so unread badges work while another chat is open
    listen('friends/'+myId,v=>{
      const ids=v?Object.keys(v).map(Number):[];
      C.friends[myId]=ids;
      ids.forEach(f=>watchPreview(dmKey(myId,f)));
    });
    listen('sentRequests/'+myId,v=>{C.friendReqOut[myId]=Object.keys(v||{}).map(t=>({from:myId,to:Number(t),status:'pending'}))});
    // Presence: mark myself online while connected, and let the server auto-remove me
    // the instant this connection drops (tab close, network loss, crash) via onDisconnect.
    // Re-armed on every (re)connect, per Firebase's recommended presence pattern.
    const presenceRef=R('onlineUsers/'+myId);
    listen('.info/connected',connected=>{
      if(connected){onDisconnect(presenceRef).remove();set(presenceRef,true).catch(()=>{})}
    });
    listen('onlineUsers',v=>{C.online=v?Object.keys(v).length:0});
    // heal my DM memberships as soon as friends load, so messages from a friend always become readable
    
  }
  function watchRoom(id){
    if(roomUnsubs[id])return;
    const u1=onValue(R('rooms/'+id),s=>{C.rooms[id]=s.val();if(ready)emit()},()=>{});
    const u2=onValue(R('roomMembers/'+id),s=>{C.roomMembers[id]=s.val()||{};if(ready)emit()},()=>{});
    roomUnsubs[id]=()=>{u1();u2()};
  }
  const fetchingRooms=new Set();
  // Fallback for a room I know the ID of (e.g. just joined) but whose per-room
  // listener hasn't reported back yet.
  function fetchRoomIfMissing(id){
    if(id==null||C.rooms[id]||fetchingRooms.has(id))return;
    fetchingRooms.add(id);
    Promise.all([get(R('rooms/'+id)),get(R('roomMembers/'+id))]).then(([rs,ms])=>{
      if(rs.exists()){C.rooms[id]=rs.val();C.roomMembers[id]=ms.val()||{};if(ready)emit()}
    }).catch(()=>{}).finally(()=>fetchingRooms.delete(id));
  }
  function watchPreview(key){
    if(previewUnsubs[key]||key===msgKey)return;
    const q=query(R('messages/'+key),orderByChild('at'),limitToLast(30));
    previewUnsubs[key]=onValue(q,s=>{
      if(key===msgKey)return;               // the full listener owns the open chat
      const arr=[];s.forEach(c=>{arr.push({...c.val(),id:c.key,images:c.val().images||[],pings:c.val().pings||[],text:c.val().text||''})});
      C.messages[key]=arr;if(ready)emit();
    },()=>{});
  }
  // The message listener follows whichever chat is open
  function watchMessages(key){
    if(key===msgKey)return;
    if(msgUnsub){msgUnsub();msgUnsub=null}
    msgKey=key;if(!key)return;
    const q=query(R('messages/'+key),orderByChild('at'),limitToLast(300));
    msgUnsub=onValue(q,s=>{
      const arr=[];s.forEach(c=>{arr.push({...c.val(),id:c.key})});
      C.messages[key]=arr.map(m=>({...m,images:m.images||[],pings:m.pings||[],text:m.text||''}));
      if(ready)emit();
    },err=>console.warn('messages denied',key,err.code));
  }

  // rebuild the {id: user} map in the shape the UI expects
  const userView=id=>{
    const u=C.users[id];if(!u)return undefined;
    const mine=Number(id)===myId;
    const st=u.style||{};
    const base=defaultSettings();
    const own=mine?(u.settings||{}):{};
    const settings={...base,...own,pings:{...base.pings,...(own.pings||{})}};
    // public bubble style: what EVERYONE sees for this person
    settings.meBubble=st.bubble||own.meBubble||base.meBubble;
    settings.meText=st.text||own.meText||base.meText;
    if(st.radius!=null&&!mine)settings.radius=st.radius;
    return{...u,id:Number(id),friends:mine?(C.friends[myId]||[]):[],
      lastRead:mine?C.lastRead:{},settings};
  };

  // Signed-in state
  let authResolve;const authReady=new Promise(r=>authResolve=r);
  let sessionDone=Promise.resolve();
  let sessionError=false;                 // true when we could NOT confirm profile state (network etc.)
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  // retry a read a few times so a transient hiccup never looks like "no account"
  async function getRetry(path,tries=4){
    let last;
    for(let i=0;i<tries;i++){
      try{return await get(R(path))}catch(e){last=e;await sleep(350*(i+1))}
    }
    throw last;
  }
  let sessionSeq=0;
  onAuthStateChanged(auth,user=>{
    const seq=++sessionSeq;
    sessionDone=(async()=>{
      stopAll();ready=false;myId=null;sessionError=false;myUid=user?user.uid:null;
      if(user){
        try{
          const s=await getRetry('uidToId/'+user.uid);
          if(seq!==sessionSeq)return;
          if(s.exists()){
            const id=s.val();
            const prof=await getRetry('users/'+id);
            if(seq!==sessionSeq)return;
            if(prof.exists()){
              myId=id;C.users[id]=prof.val();startListeners();
            }
            // uidToId exists but profile is missing -> genuinely unfinished signup (needsProfile)
          }
        }catch(e){console.error('session load failed',e);sessionError=true}
      }
      if(seq!==sessionSeq)return;
      ready=true;authResolve();emit();
    })();
  });

  return{
    authReady,
    settle:async()=>{await authReady;await sessionDone;},
    onChange:f=>{listeners.add(f);return()=>listeners.delete(f)},
    dmKey,watchMessages,
    isLoggedIn:()=>!!myUid,
    // Only true when we CONFIRMED there is no profile. A failed/slow read is never treated as "no username".
    needsProfile:()=>!!myUid&&!sessionError&&!(myId&&C.users[myId]),
    hadSessionError:()=>sessionError,

    /* --- Users --- */
    usernameTaken(name,exceptId){
      const id=C.usernames[name.toLowerCase()];
      return id!==undefined&&id!==exceptId;
    },
    async checkUsernameFree(name){
      const key=name.toLowerCase();
      // signed out: the public lookup node is readable; signed in: the real index is authoritative
      const path=myUid||auth.currentUser?'usernames/'+key:'usernameLogin/'+key;
      const s=await get(R(path));return !s.exists();
    },
    currentUser(){return myId?userView(myId):null},
    getUser:id=>{const v=userView(id);if(!v)fetchUserIfMissing(id);return v},
    allUsers:()=>Object.keys(C.users).map(userView),
    get:()=>({usernameIndex:C.usernames,rooms:C.rooms}),
    onlineCount:()=>C.online,

    async createUser({username,email,password}){
      if(!CFG.USERNAME_RE.test(username))throw new Error('Username must be 1-20 chars using 0-9, a-z, A-Z, ".", "_" or "-".');
      if(email&&!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email))throw new Error('Please enter a real email address.');
      let cred;
      try{cred=await createUserWithEmailAndPassword(auth,email||(username.toLowerCase()+FAKE),password)}
      catch(e){throw new Error(authMsg(e))}
      // now signed in: safe to check the username
      if(!(await this.checkUsernameFree(username))){
        try{await deleteUser(cred.user)}catch(_){}
        throw new Error('That username is already taken.');
      }
      try{await this._finishProfile(cred.user,username,email||null,'password')}
      catch(e){try{await deleteUser(cred.user)}catch(_){}throw e}
      if(email){try{await sendEmailVerification(cred.user)}catch(_){}}
      return this.currentUser();
    },
    // Claims the next ID, then writes uidToId -> usernames -> users (order required by the rules)
    async _finishProfile(fbUser,username,email,provider){
      let id=(await get(R('uidToId/'+fbUser.uid))).val();      // reuse ID from an interrupted signup
      if(id==null){
        const tx=await runTransaction(R('counters/userId'),n=>(n||0)+1);
        if(!tx.committed)throw new Error('Could not reserve a user ID. Try again.');
        id=tx.snapshot.val();
        await set(R('uidToId/'+fbUser.uid),id);
      }
      try{
        await set(R('usernames/'+username.toLowerCase()),id);
      }catch(e){
        console.error('usernames write failed',e);
        throw new Error(e.code==='PERMISSION_DENIED'||/permission/i.test(e.message)
          ?'Username was taken or blocked by database rules. Try another.'
          :'Could not save username: '+(e.code||e.message));
      }
      const rec={username,createdAt:Date.now(),lastNameChange:0,provider};
      if(email)rec.email=email;
      // write profile + login lookup in parallel (both only need usernames/uidToId, already written)
      await Promise.all([
        set(R('users/'+id),rec),
        set(R('usernameLogin/'+username.toLowerCase()),{email:email||(username.toLowerCase()+FAKE)}).catch(e=>console.warn('lookup write failed',e))
      ]);
      // seed the cache immediately so the UI never waits on the listener round-trip
      C.users[id]={...rec};C.usernames[username.toLowerCase()]=id;
      myId=id;sessionError=false;startListeners();
      emit();
    },
    async completeGoogleProfile(username){
      if(!CFG.USERNAME_RE.test(username))throw new Error('Username must be 1-20 chars using 0-9, a-z, A-Z, ".", "_" or "-".');
      if(!(await this.checkUsernameFree(username)))throw new Error('That username is already taken.');
      const u=auth.currentUser;
      await this._finishProfile(u,username,u.email||null,'google');
      return this.currentUser();
    },
    async login(idf,password){
      let email=idf.trim();
      if(!email.includes('@')){
        // username login: look up ID, then the account's email
        let rec;
        try{rec=(await get(R('usernameLogin/'+email.toLowerCase()))).val()}
        catch(e){
          throw new Error(e.code==='PERMISSION_DENIED'
            ?'Username sign-in is unavailable right now (database rules block the lookup). Try signing in with your email instead.'
            :'Could not look up that username: '+(e.code||e.message));
        }
        if(!rec)throw new Error('Incorrect username/email or password.');
        email=rec.email||(email.toLowerCase()+FAKE);
      }
      try{await signInWithEmailAndPassword(auth,email,password)}
      catch(e){throw new Error(authMsg(e))}
      await new Promise(r=>setTimeout(r,0));   // let onAuthStateChanged fire
      await this.settle();
      const u=this.currentUser();
      if(!u)throw new Error('Signed in, but your account profile could not be loaded. Try again.');
      return u;
    },
    async googleSignIn(){
      try{await signInWithPopup(auth,new GoogleAuthProvider())}
      catch(e){throw new Error(authMsg(e))}
      await new Promise(r=>setTimeout(r,0));   // let onAuthStateChanged fire
      await this.settle();
      return{needsProfile:!this.currentUser()};
    },
    async signOut(){
      if(myId!=null)await remove(R('onlineUsers/'+myId)).catch(()=>{});
      stopAll();await fbSignOut(auth);myId=null;
    },
    async resetPassword(email){try{await sendPasswordResetEmail(auth,email)}catch(e){throw new Error(authMsg(e))}},
    // Lets a Google-signed-up account also sign in with username/password.
    hasPasswordLogin:()=>!!auth.currentUser?.providerData.some(p=>p.providerId==='password'),
    async setPassword(password){
      const u=auth.currentUser;if(!u)throw new Error('Not signed in.');
      if(password.length<CFG.MIN_PW)throw new Error(`Password must be at least ${CFG.MIN_PW} characters.`);
      const rec=C.users[myId]||{};
      const email=u.email||rec.email||(rec.username?.toLowerCase()+FAKE);
      try{await linkWithCredential(u,EmailAuthProvider.credential(email,password))}
      catch(e){
        if(e.code==='auth/provider-already-linked'||e.code==='auth/credential-already-in-use')
          throw new Error('Password sign-in is already set up for this account.');
        throw new Error(authMsg(e));
      }
      // make sure username-login lookup points at the real email, not a placeholder
      if(rec.username)await set(R('usernameLogin/'+rec.username.toLowerCase()),{email}).catch(()=>{});
    },

    async renameUser(id,newName){
      const u=C.users[id];
      if(!u)throw new Error('Account not loaded yet. Try again in a moment.');
      if(!CFG.USERNAME_RE.test(newName))throw new Error('Invalid username format.');
      if(newName===u.username)return userView(id);
      const oldKey=u.username.toLowerCase(),newKey=newName.toLowerCase();
      const wait=(u.lastNameChange||0)+CFG.NAME_CHANGE_MS-Date.now();
      if(wait>0&&(u.lastNameChange||0)!==0){const d=Math.ceil(wait/86400000);throw new Error(`You can change your username again in ${d} day${d>1?'s':''}.`);}
      // only a real conflict if the new key belongs to someone ELSE (changing capitalisation of your own name is fine)
      if(newKey!==oldKey){
        const taken=(await get(R('usernames/'+newKey))).val();
        if(taken!=null&&Number(taken)!==Number(id))throw new Error('That username is already taken.');
      }
      const email=u.email||(oldKey+FAKE);
      const stamp=Date.now();
      // Single atomic multi-path write: claim the new name, update the profile, point the
      // login lookup at the new name, and free the old name+lookup all in one request.
      // Rules are validated against the state that results from ALL of these together, so
      // there is no window where the old name is freed but the new one isn't claimed yet
      // (or vice versa) — which is what let the old username end up permanently stuck
      // ("shows available" in the signed-out check but "already taken" on Create Account)
      // when a partial failure or a slow network landed the writes out of order before.
      const patch={};
      patch['users/'+id+'/username']=newName;
      patch['users/'+id+'/lastNameChange']=stamp;
      if(newKey!==oldKey){
        patch['usernames/'+newKey]=id;
        patch['usernameLogin/'+newKey]={email};
        patch['usernames/'+oldKey]=null;
        patch['usernameLogin/'+oldKey]=null;
      }
      try{
        await update(ref(rtdb),patch);
      }catch(e){
        throw new Error('Could not change username: '+(e.code||e.message));
      }
      C.users[id]={...u,username:newName,lastNameChange:stamp};
      C.usernames[newKey]=id;if(newKey!==oldKey)delete C.usernames[oldKey];
      emit();
      return userView(id);
    },
    async updateSettings(id,patch){
      const cur=C.users[id]||{};
      const merged={...(cur.settings||{}),...patch};
      const style={bubble:merged.meBubble||'#7c6cff',text:merged.meText||'#ffffff',radius:Number(merged.radius)||16};
      C.users[id]={...cur,settings:merged,style};emit();
      try{
        // public style first (tiny, everyone reads it), then the private settings blob
        await set(R(`users/${id}/style`),style);
        await set(R(`users/${id}/settings`),merged);
      }catch(e){console.error('settings save failed',e);toast('Could not save settings ('+(e.code||e.message)+')','bad');throw e}
    },
    // Only writes when there is genuinely something newer than what's already marked read.
    // (Without this guard: render -> markRead -> lastRead listener echo -> render -> markRead ... forever.)
    markRead(uid,key){
      const msgs=C.messages[key]||[];
      const newest=msgs.length?Math.max(...msgs.map(m=>Number(m.at)||0)):0;
      const have=C.lastRead[key]||0;
      if(newest<=have)return;
      C.lastRead[key]=newest;
      set(R(`lastRead/${uid}/${key}`),newest).catch(()=>{});
    },

    /* --- Friends --- */
    friends:id=>C.friends[id]||[],
    incoming:me=>Object.keys(C.friendReqIn).map(from=>({from:Number(from),to:me,status:'pending',at:C.friendReqIn[from].at})),
    outgoing:me=>(C.friendReqOut[me]||[]),
    async friendReq(from,toUsername){
      let to=C.usernames[toUsername.toLowerCase()];
      if(to===undefined){
        // cache may be stale; ask the server directly
        const s=await get(R('usernames/'+toUsername.toLowerCase()));
        if(s.exists())to=s.val();
      }
      return this.friendReqById(from,to);
    },
    async friendReqById(from,to){
      to=Number(to);
      if(!to||Number.isNaN(to))throw new Error('No user with that username.');
      if(to===from)throw new Error("You can't add yourself.");
      if((C.friends[from]||[]).includes(to))throw new Error('Already friends.');
      // they already asked me -> just accept
      if(C.friendReqIn[to]){await this.acceptFriend(from,to);return 'accepted'}
      if((C.friendReqOut[from]||[]).some(r=>r.to===to))throw new Error('Request already sent.');
      try{
        await set(R(`friendRequests/${to}/${from}`),{at:Date.now()});
        await set(R(`sentRequests/${from}/${to}`),true);
      }catch(e){
        await remove(R(`friendRequests/${to}/${from}`)).catch(()=>{});
        throw new Error('Could not send request ('+(e.code||e.message)+')');
      }
      // local echo so the button flips to "Requested" instantly (dedupe: a fast
      // double-click can otherwise get this far twice before the cache updates
      // and would double up the entry even though only one request exists server-side)
      const existing=C.friendReqOut[from]||[];
      if(!existing.some(r=>r.to===to))C.friendReqOut[from]=[...existing,{from,to,status:'pending'}];
      emit();
      return 'sent';
    },
    async acceptFriend(me,other){
      // Order matters for the rules:
      //  1) my side of the friendship          (I own friends/me/*)
      //  2) their side                         (allowed only while their request to me still exists)
      //  3) my DM membership                   (I can only write my own dmMembers entry)
      //  4) clear the request + sent marker
      const key=dmKey(me,other);
      try{
        await set(R(`friends/${me}/${other}`),true);
        await set(R(`friends/${other}/${me}`),true);
        await set(R(`dmMembers/${key}/${me}`),true);
      }catch(e){
        console.error('acceptFriend failed',e);
        throw new Error('Could not accept request ('+(e.code||e.message)+')');
      }
      await remove(R(`friendRequests/${me}/${other}`)).catch(()=>{});
      await remove(R(`sentRequests/${other}/${me}`)).catch(()=>{});
      C.friends[me]=[...new Set([...(C.friends[me]||[]),other])];
      delete C.friendReqIn[other];
      (C.dmMembers[key]=C.dmMembers[key]||{})[me]=true;
      watchPreview(key);emit();
      // the other person's client writes THEIR dmMembers entry when it sees the friendship (ensureDmMemberships)
    },
    async declineFriend(me,other){
      await remove(R(`friendRequests/${me}/${other}`));
      await remove(R(`sentRequests/${other}/${me}`)).catch(()=>{});
      delete C.friendReqIn[other];emit();
    },
    async cancelReq(me,other){
      await remove(R(`friendRequests/${other}/${me}`));
      await remove(R(`sentRequests/${me}/${other}`)).catch(()=>{});
      C.friendReqOut[me]=(C.friendReqOut[me]||[]).filter(r=>r.to!==other);emit();
    },
    async removeFriend(me,other){
      await remove(R(`friends/${me}/${other}`));
      C.friends[me]=(C.friends[me]||[]).filter(x=>x!==other);emit();
    },
    isFriend:(me,other)=>(C.friends[me]||[]).includes(other),
    hasIncoming:from=>!!C.friendReqIn[from],
    hasOutgoing:(me,to)=>(C.friendReqOut[me]||[]).some(r=>r.to===to),

    /* --- Rooms --- */
    async createRoom(owner,name){
      name=name.trim();
      if(!name||name.length>30)throw new Error('Room name must be 1-30 characters.');
      const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      const mkCode=()=>Array.from(crypto.getRandomValues(new Uint8Array(6))).map(b=>chars[b%32]).join('');
      const id=push(R('rooms')).key;
      // 1) claim a unique join code (roomCodes rule: write only if it doesn't already exist)
      let code=null;
      for(let i=0;i<6&&!code;i++){
        const c=mkCode();
        try{await set(R('roomCodes/'+c),id);code=c}catch(e){if(e.code!=='PERMISSION_DENIED')throw e}
      }
      if(!code)throw new Error('Could not generate a room code. Try again.');
      const room={name,ownerId:owner,code};
      try{
        // 2) room record (new room => anyone signed in may create it; ownerId must be me)
        await set(R('rooms/'+id),room);
        // 3) my membership + my personal room index
        await set(R('roomMembers/'+id+'/'+owner),true);
        await set(R('userRooms/'+owner+'/'+id),true);
      }catch(e){
        await remove(R('rooms/'+id)).catch(()=>{});
        console.error('createRoom failed',e);
        throw new Error('Could not create room ('+(e.code||e.message)+'). Make sure the latest database rules are published.');
      }
      C.rooms[id]=room;C.roomMembers[id]={[owner]:true};
      if(!C.myRoomIds.includes(id))C.myRoomIds=[...C.myRoomIds,id];
      watchRoom(id);emit();
      return{id,name,code,ownerId:owner};
    },
    async joinRoom(uid,code){
      code=code.trim().toUpperCase();
      if(!/^[A-Z0-9]{6}$/.test(code))throw new Error('Room codes are 6 letters/numbers.');
      const id=(await get(R('roomCodes/'+code))).val();
      if(!id)throw new Error('No room with that code.');
      await set(R(`roomMembers/${id}/${uid}`),true);
      await set(R('userRooms/'+uid+'/'+id),true);
      if(!C.myRoomIds.includes(id))C.myRoomIds=[...C.myRoomIds,id];
      watchRoom(id);fetchRoomIfMissing(id);emit();
      return{id};
    },
    async leaveRoom(uid,id){
      await remove(R(`roomMembers/${id}/${uid}`));
      await remove(R(`userRooms/${uid}/${id}`)).catch(()=>{});
      C.myRoomIds=C.myRoomIds.filter(x=>x!==id);emit();
    },
    myRooms:uid=>C.myRoomIds.filter(id=>C.rooms[id]).map(id=>({id,...C.rooms[id],type:'private',members:Object.keys(C.roomMembers[id]||{}).map(Number)})),
    getRoom:id=>{
      if(!C.rooms[id]){fetchRoomIfMissing(id);return undefined}
      return{id,...C.rooms[id],members:Object.keys(C.roomMembers[id]||{}).map(Number)};
    },

    /* --- Messages --- */
    /* Anti-nuke: if an account fires NUKE_MSGS messages inside NUKE_WINDOW_MS,
       it's treated as a spam/nuke attempt. The account is frozen as "Deleted User",
       its login/username index entries are removed, and the user is signed out. */
    _sendTimes:[],
    async antiNuke(id){
      if(DB._nuking)return;DB._nuking=true;
      try{
        const u=C.users[id]||{};
        const oldKey=(u.username||'').toLowerCase();
        // 1) mark profile deleted. The rules allow 'Deleted User' ONLY together with deleted:true.
        await update(R('users/'+id),{deleted:true,username:'Deleted User'});
        // 2) free the username + login lookup (best effort)
        if(oldKey){
          await remove(R('usernameLogin/'+oldKey)).catch(()=>{});
          await remove(R('usernames/'+oldKey)).catch(()=>{});
        }
        await remove(R('onlineUsers/'+id)).catch(()=>{});
        // 3) wipe private per-user data (best effort; rules allow the owner)
        await remove(R('userRooms/'+id)).catch(()=>{});
        await remove(R('lastRead/'+id)).catch(()=>{});
        await remove(R('settings/'+id)).catch(()=>{});
      }catch(e){console.warn('anti-nuke cleanup partial',e)}
      // 4) sign out and hard-refresh no matter what happened above
      try{stopAll();await fbSignOut(auth)}catch(_){}
      try{localStorage.clear();sessionStorage.clear()}catch(_){}
      location.reload();
    },
    async sendMessage(key,{senderId,text,images,pings}){
      // ---- anti-nuke: sliding window on outgoing messages ----
      const now0=Date.now();
      DB._sendTimes=DB._sendTimes.filter(t=>now0-t<CFG.NUKE_WINDOW_MS);
      DB._sendTimes.push(now0);
      if(DB._sendTimes.length>=CFG.NUKE_MSGS){
        DB.antiNuke(senderId);
        throw new Error('Sending too fast — account locked.');
      }
      const at=Date.now()+SKEW;   // corrected by Firebase's server clock offset
      const m={senderId,at};
      if(text)m.text=text;
      if(images&&images.length)m.images=images;
      if(pings&&pings.length)m.pings=pings;
      // DM: make sure MY membership exists before writing (fixes "can't send in a new DM")
      if(key.startsWith('dm_')&&!(C.dmMembers[key]&&C.dmMembers[key][senderId])){
        try{await set(R(`dmMembers/${key}/${senderId}`),true);(C.dmMembers[key]=C.dmMembers[key]||{})[senderId]=true}catch(_){}
      }
      const newRef=push(R('messages/'+key));
      // optimistic local echo (replaced automatically when the server copy arrives with the same id)
      const arr=C.messages[key]||(C.messages[key]=[]);
      const tmp={...m,images:images||[],pings:pings||[],text:text||'',id:newRef.key};
      if(key===msgKey){arr.push(tmp);emit()}
      try{
        // The database rules require rate/$senderId === server time on every message write,
        // so write both atomically in one multi-path update (both validated against the same `now`).
        // Root-level multi-path update: rules are checked per path, and the message's
        // validate rule reads rate/<id> from the same request's newData.
        await update(ref(rtdb),{
          ['rate/'+senderId]:serverTimestamp(),
          ['messages/'+key+'/'+newRef.key]:m
        });
      }
      catch(e){C.messages[key]=(C.messages[key]||[]).filter(x=>x!==tmp);emit();throw new Error('Message failed to send ('+(e.code||e.message)+')')}
    },
    messages:key=>C.messages[key]||[],
    unreadDMs(uid){
      let n=0;
      (C.friends[uid]||[]).forEach(f=>{
        const k=dmKey(uid,f);const last=C.lastRead[k]||0;
        n+=(C.messages[k]||[]).filter(m=>m.senderId!==uid&&m.at>last).length;
      });
      return n+Object.keys(C.friendReqIn).length;
    },
    // called by the UI so a friendship created by the other person becomes a DM on this side too
    async ensureDmMemberships(){
      if(!myId)return;
      for(const f of (C.friends[myId]||[])){
        const k=dmKey(myId,f);
        if(!(C.dmMembers[k]&&C.dmMembers[k][myId])){
          try{await set(R(`dmMembers/${k}/${myId}`),true);(C.dmMembers[k]=C.dmMembers[k]||{})[myId]=true}catch(_){}
        }
      }
    }
  };
  function defaultSettings(){return{
    meBubble:'#7c6cff',meText:'#ffffff',
    radius:16,font:'system',size:15,bold:false,italic:false,
    bgType:'none',bgColor:'#0f1020',bgColor2:'#171830',bgImage:'',bgFit:'cover',bgBlur:0,bgDim:30,
    uiOpacity:72,uiBlur:14,
    autoScrollBottom:true,
    pings:{everyone:true,sound:true,desktop:false}
  }}
  function authMsg(e){
    const m={
      'auth/email-already-in-use':'That email is already registered.',
      'auth/invalid-email':'Please enter a real email address.',
      'auth/weak-password':'Password is too weak (min 6 characters).',
      'auth/invalid-credential':'Incorrect username/email or password.',
      'auth/wrong-password':'Incorrect username/email or password.',
      'auth/user-not-found':'Incorrect username/email or password.',
      'auth/too-many-requests':'Too many attempts. Try again later.',
      'auth/popup-closed-by-user':'Sign-in cancelled.',
      'auth/network-request-failed':'Network error. Check your connection.'
    };
    return m[e.code]||('Authentication error: '+(e.code||e.message));
  }
})();

/* ---------- Auto-update: keep everyone on the latest deployed version ---------- */
// Periodically re-fetches this page (bypassing cache) and compares the
// build-version meta tag against the one this tab actually loaded with. If a
// new version has been published, everyone still sitting on the old tab gets
// nudged to refresh instead of silently running stale code indefinitely.
const MY_BUILD=document.querySelector('meta[name="build-version"]')?.content||'';
let updatePending=false;
async function checkForUpdate(){
  if(updatePending||!MY_BUILD)return;
  try{
    const res=await fetch(location.pathname+location.search+(location.search?'&':'?')+'_v='+Date.now(),{cache:'no-store'});
    if(!res.ok)return;
    const html=await res.text();
    const m=html.match(/<meta\s+name=["']build-version["']\s+content=["']([^"']+)["']/i);
    const latest=m&&m[1];
    if(latest&&latest!==MY_BUILD){
      updatePending=true;
      toast('A new version is available — refreshing…');
      setTimeout(()=>location.reload(),1800);
    }
  }catch(_){/* offline, or the file:// / hosting setup blocks this — silently retry later */}
}
setInterval(checkForUpdate,120000);                 // poll every 2 minutes
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkForUpdate()});
window.addEventListener('focus',checkForUpdate);
function beep(){
  try{
    const c=new(window.AudioContext||window.webkitAudioContext)();
    const o=c.createOscillator(),g=c.createGain();
    o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.08;
    o.start();o.stop(c.currentTime+.12);
  }catch(e){}
}

    if(!ME.friends.length)addHTML(list,`<div class="hint" style="padding:6px 10px">Add friends to start chatting.</div>`);
    ME.friends.forEach(fid=>{

/* Render messages */
let lastCount={};
// Tracks what's actually in the DOM right now, so a new message can be appended
// on its own instead of tearing down and rebuilding every bubble already shown
// (which used to make the whole conversation "flash"/re-animate on every send).
let renderedKey=null,renderedIds=[];
// id -> {el, sig}. "sig" is what msgEl() actually rendered for that sender at the
// time (their name + deleted-state). A sender can resolve AFTER the bubble was
// first painted — e.g. the bulk 'users' listener hasn't finished its first sync
// yet, or a one-off fetchUserIfMissing() is still in flight — which used to leave
// messages permanently stuck showing "Deleted User" once we stopped rebuilding
// the whole list on every update. senderSig()/patchResolvedSenders() below
// re-check every rendered bubble whenever anything changes and swap in a fresh
// element only for the ones whose sender info actually changed.
let renderedNodes=new Map();
function senderSig(m){
  const sender=DB.getUser(m.senderId);
  return(sender&&!sender.deleted)?sender.username:'Deleted User';
}
function appendMsgRow(box,m,lastDay){
  const day=new Date(m.at).toDateString();
  if(day!==lastDay){const d=document.createElement('div');d.className='date-sep';d.textContent=day;box.appendChild(d)}
  const el=msgEl(m);
  box.appendChild(el);
  renderedNodes.set(m.id,{el,sig:senderSig(m)});
  return day;
}
function patchResolvedSenders(list){
  list.forEach(m=>{
    const rec=renderedNodes.get(m.id);
    if(!rec)return;
    const sig=senderSig(m);
    if(sig!==rec.sig){
      const fresh=msgEl(m);
      rec.el.replaceWith(fresh);
      renderedNodes.set(m.id,{el:fresh,sig});
    }
  });
}
function renderMessages(key){
  const box=$('#messages');
  const roomChanged=key!==renderedKey;
  const list=DB.messages(key);
  const ids=list.map(m=>m.id);
  const autoScroll=ME.settings.autoScrollBottom!==false;
  // Only "append new messages" when the room hasn't changed, we already have
  // something rendered, and every previously-rendered id is still there in the
  // same order (i.e. this update is purely new messages, not a switch/deletion).
  const isAppendOnly=!roomChanged&&renderedIds.length>0&&ids.length>=renderedIds.length
    &&renderedIds.every((id,i)=>ids[i]===id);
  const atBottom=roomChanged?true:(box.scrollHeight-box.scrollTop-box.clientHeight<80);

  if(roomChanged||!isAppendOnly){
    // Full rebuild: entering/switching a room, or the list changed in a
    // non-append way (e.g. a message was unsent). Always land at the bottom
    // when it's a fresh room, instead of wherever the old room happened to
    // leave the scrollbar.
    box.innerHTML='';renderedNodes=new Map();
    if(!list.length)box.innerHTML='<div class="sys">No messages yet. Say hi! 👋</div>';
    let lastDay='';
    list.forEach(m=>{lastDay=appendMsgRow(box,m,lastDay)});
    box.scrollTop=box.scrollHeight;
  }else{
    // Append-only: just add the new rows, leaving existing bubbles untouched...
    const newOnes=list.slice(renderedIds.length);
    if(newOnes.length){
      let lastDay=new Date(list[renderedIds.length-1].at).toDateString();
      newOnes.forEach(m=>{lastDay=appendMsgRow(box,m,lastDay)});
      if(autoScroll||atBottom)box.scrollTop=box.scrollHeight;
    }
    // ...but still fix up any earlier bubble whose sender has since resolved
    // (or, rarely, been marked deleted), without touching the ones that are
    // already showing the right thing.
    patchResolvedSenders(list);
  }
  renderedKey=key;renderedIds=ids;

  // ping detection for new messages
  const prev=lastCount[key]??list.length;
  if(list.length>prev){
    list.slice(prev).forEach(m=>{
      if(m.senderId===ME.id)return;
      const pinged=m.pings.includes(ME.id)||(m.pings.includes('everyone')&&ME.settings.pings.everyone);
      if(pinged){
        const s=DB.getUser(m.senderId);
        toast(`${s?.username} pinged you`,'ping');
        if(ME.settings.pings.sound)beep();
      }
    });
  }
  lastCount[key]=list.length;
}

function msgEl(m){
  const mine=m.senderId===ME.id;
  const sender=DB.getUser(m.senderId);           // username resolved via ID at render time
  const name=(sender&&!sender.deleted)?sender.username:'Deleted User';
  const pinged=!mine&&(m.pings.includes(ME.id)||m.pings.includes('everyone'));
  const el=document.createElement('div');el.className='msg'+(mine?' me':'');
  const time=new Date(m.at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  const av=`<div class="avatar" style="width:30px;height:30px;font-size:12px">${esc(name[0].toUpperCase())}</div>`;
  // Everyone's message bubble reflects how THEY styled their own messages (their meBubble/meText),
  // not a color the viewer picks for "others" — so no per-viewer "others' color" setting exists anymore.
  let bStyle='';
  if(!mine){
    const ss=sender&&sender.settings;
    const bg=safeColor(ss&&ss.meBubble,'#7c6cff'),fg=safeColor(ss&&ss.meText,'#ffffff');
    bStyle=` style="background:${bg};color:${fg}"`;
  }
  el.innerHTML=`${mine?'':av}<div><div class="meta">${mine?'':esc(name)+' · '}${time}${m.senderId===1?' <span class="tag owner">#1</span>':''}</div>
    <div class="bubble${pinged?' pinged':''}"${bStyle}>${fmtText(m.text)}${imagesHTML(m.images)}</div></div>`;
  el.querySelectorAll('.imgs img').forEach((img,i)=>img.onclick=()=>openLightbox(m.images,i));
  return el;
}
function safeColor(c,fb){return /^#[0-9a-fA-F]{3,8}$/.test(c||'')?c:fb}
function fmtText(t){
  if(!t)return'';
  let s=esc(t);
  s=s.replace(/@(everyone|here)\b/g,'<span class="mention everyone">@$1</span>');
  s=s.replace(/@([0-9a-zA-Z._-]{1,20})/g,(full,n)=>{
    if(n==='everyone'||n==='here')return full;
    const id=DB.get().usernameIndex[n.toLowerCase()];
    if(id===undefined)return full;
    const u=DB.getUser(id);
    return `<span class="mention${id===ME.id?' me':''}">@${esc(u.username)}</span>`;
  });
  return s;
}
function imagesHTML(imgs){
  if(!imgs||!imgs.length)return'';
  const n=imgs.length;
  const cls=n===1?'n1':n===2?'n2':n===3?'n3':n===4?'n4':'multi';
  return `<div class="imgs ${cls}">${imgs.map(s=>`<img src="${s}" alt="image" loading="lazy">`).join('')}</div>`;
}

/* Lightbox */
function openLightbox(imgs,i){
  let idx=i;
  const root=$('#lightboxRoot');
  function draw(){
    root.innerHTML=`<div class="lightbox" id="lb"><img src="${imgs[idx]}">
      <button class="lb-btn lb-close" id="lbX">✕</button>
      ${imgs.length>1?`<button class="lb-btn lb-prev" id="lbP">‹</button><button class="lb-btn lb-next" id="lbN">›</button><div class="lb-count">${idx+1} / ${imgs.length}</div>`:''}</div>`;
    $('#lbX').onclick=close;
    $('#lb').onclick=e=>{if(e.target.id==='lb')close()};
    if(imgs.length>1){
      $('#lbP').onclick=e=>{e.stopPropagation();idx=(idx-1+imgs.length)%imgs.length;draw()};
      $('#lbN').onclick=e=>{e.stopPropagation();idx=(idx+1)%imgs.length;draw()};
    }
  }
  function close(){root.innerHTML='';document.removeEventListener('keydown',key)}
  function key(e){
    if(e.key==='Escape')close();
    if(imgs.length>1&&e.key==='ArrowLeft'){idx=(idx-1+imgs.length)%imgs.length;draw()}
    if(imgs.length>1&&e.key==='ArrowRight'){idx=(idx+1)%imgs.length;draw()}
  }
  document.addEventListener('keydown',key);draw();
}

/* Composer */
const msgIn=$('#msgIn');
msgIn.addEventListener('input',()=>{
  msgIn.style.height='auto';msgIn.style.height=Math.min(msgIn.scrollHeight,140)+'px';
  $('#cc').textContent=msgIn.value.length;
  updateMentionPop();
});
msgIn.addEventListener('keydown',e=>{
  const pop=$('#mentionPop');
  if(!pop.classList.contains('hidden')){
    const items=[...pop.children];
    if(e.key==='ArrowDown'){e.preventDefault();view.mentionSel=(view.mentionSel+1)%items.length;hilite();return}
    if(e.key==='ArrowUp'){e.preventDefault();view.mentionSel=(view.mentionSel-1+items.length)%items.length;hilite();return}
    if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();items[view.mentionSel].click();return}
    if(e.key==='Escape'){pop.classList.add('hidden');return}
  }
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}
});
function hilite(){[...$('#mentionPop').children].forEach((c,i)=>c.classList.toggle('sel',i===view.mentionSel))}
function mentionCandidates(){
  const key=view.roomKey;let ids=[];
  if(key===CFG.GLOBAL_ROOM)ids=DB.allUsers().map(u=>u.id);
  else if(key?.startsWith('dm_'))ids=key.split('_').slice(1).map(Number);
  else ids=DB.getRoom(key)?.members||[];
  return ids.filter(i=>i!==ME.id).map(i=>DB.getUser(i)).filter(Boolean);
}
function updateMentionPop(){
  const pop=$('#mentionPop');
  const pos=msgIn.selectionStart;
  const before=msgIn.value.slice(0,pos);
  const m=before.match(/@([0-9a-zA-Z._-]*)$/);
  if(!m){pop.classList.add('hidden');return}
  const q=m[1].toLowerCase();
  let opts=mentionCandidates().filter(u=>u.username.toLowerCase().startsWith(q)).slice(0,6)
    .map(u=>({label:u.username,ic:'👤'}));
  if(view.roomKey!==null&&!view.roomKey.startsWith('dm_')&&'everyone'.startsWith(q))opts.unshift({label:'everyone',ic:'📣'});
  if(!opts.length){pop.classList.add('hidden');return}
  view.mentionSel=0;pop.innerHTML='';
  opts.forEach((o,i)=>{
    const d=document.createElement('div');d.className=i===0?'sel':'';
    d.innerHTML=`${o.ic} ${esc(o.label)}`;
    d.onclick=()=>{
      const start=pos-m[0].length;
      msgIn.value=msgIn.value.slice(0,start)+'@'+o.label+' '+msgIn.value.slice(pos);
      msgIn.focus();pop.classList.add('hidden');
      const np=start+o.label.length+2;msgIn.setSelectionRange(np,np);
    };
    pop.appendChild(d);
  });
  pop.classList.remove('hidden');
}
$('#sendBtn').onclick=send;

function extractPings(text){
  const out=new Set();
  if(/@everyone\b|@here\b/.test(text)&&view.roomKey!==CFG.GLOBAL_ROOM)out.add('everyone');
  const re=/@([0-9a-zA-Z._-]{1,20})/g;let m;
  while((m=re.exec(text))){
    const id=DB.get().usernameIndex[m[1].toLowerCase()];
    if(id!==undefined&&id!==ME.id)out.add(id);
  }
  return[...out];
}
let _lastSendAt=0;
function send(){
  const text=msgIn.value.trim().slice(0,CFG.MAX_MSG);
  if(!text&&!view.pending.length)return;
  if(!view.roomKey)return;
  // Friendly throttle: the database only accepts one message per 300ms, and
  // 3 messages inside 1 second triggers anti-nuke. Normal typing stays well under both.
  const nowMs=Date.now();
  if(nowMs-_lastSendAt<350){toast('Slow down a little!','bad');return}
  _lastSendAt=nowMs;
  DB.sendMessage(view.roomKey,{senderId:ME.id,text,images:view.pending.slice(),pings:extractPings(text)})
    .catch(e=>toast(e.message,'bad'));
  msgIn.value='';msgIn.style.height='auto';$('#cc').textContent=0;
  view.pending=[];renderPreviews();$('#mentionPop').classList.add('hidden');
  renderMessages(view.roomKey);
  $('#messages').scrollTop=$('#messages').scrollHeight;
}

/* Images */
$('#attachBtn').onclick=()=>$('#fileIn').click();
$('#fileIn').onchange=async e=>{
  const files=[...e.target.files];e.target.value='';
  for(const f of files){
    if(view.pending.length>=CFG.MAX_IMAGES){toast(`Max ${CFG.MAX_IMAGES} images per message.`,'bad');break}
    if(!f.type.startsWith('image/')){toast('Only images are allowed.','bad');continue}
    if(f.size>CFG.MAX_IMG_BYTES){toast(`${f.name} is too large (max 8MB).`,'bad');continue}
    view.pending.push(await compressImage(f));
  }
  renderPreviews();
};
function compressImage(file,max=1280,q=.82){
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const s=Math.min(1,max/Math.max(img.width,img.height));
        const c=document.createElement('canvas');c.width=img.width*s;c.height=img.height*s;
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',q));
      };
      img.src=r.result;
    };
    r.readAsDataURL(file);
  });
}
function renderPreviews(){
  const p=$('#previews');p.innerHTML='';
  view.pending.forEach((s,i)=>{
    const d=document.createElement('div');d.className='pv';
    d.innerHTML=`<img src="${s}"><button>✕</button>`;
    d.querySelector('button').onclick=()=>{view.pending.splice(i,1);renderPreviews()};
    p.appendChild(d);
  });
}
msgIn.addEventListener('paste',async e=>{
  const files=[...(e.clipboardData?.files||[])].filter(f=>f.type.startsWith('image/'));
  if(!files.length)return;e.preventDefault();
  for(const f of files){
    if(view.pending.length>=CFG.MAX_IMAGES){toast(`Max ${CFG.MAX_IMAGES} images.`,'bad');break}
    view.pending.push(await compressImage(f));
  }
  renderPreviews();
});

/* ---------- Style (personal, only visible to this user) ---------- */
const FONTS={
  system:'system-ui,-apple-system,Segoe UI,sans-serif',
  serif:'Georgia,"Times New Roman",serif',
  mono:'ui-monospace,Menlo,Consolas,monospace',
  rounded:'"Trebuchet MS","Comic Sans MS",cursive,sans-serif',
  impact:'Impact,"Arial Black",sans-serif'
};
function bgCSS(s){
  if(s.bgType==='color')return s.bgColor;
  if(s.bgType==='gradient')return `linear-gradient(135deg,${s.bgColor},${s.bgColor2})`;
  if(s.bgType==='image'&&s.bgImage)return `url("${s.bgImage}")`;
  return '';
}
// Paints a background into a {layer,dim} pair. The layer is oversized (inset:-Npx) and its parent clips it,
// so blur never bleeds white edges and never spills off screen.
function paintBg(layer,dim,s){
  const css=bgCSS(s);
  if(!css){layer.style.background='';layer.style.filter='none';dim.style.opacity=0;return}
  layer.style.background=css;
  layer.style.backgroundSize=(s.bgType==='image'&&s.bgFit==='contain')?'contain':'cover';
  layer.style.backgroundRepeat='no-repeat';layer.style.backgroundPosition='center';
  layer.style.filter=s.bgType==='image'&&s.bgBlur>0?`blur(${s.bgBlur}px)`:'none';
  dim.style.opacity=(s.bgDim||0)/100;
}
function applyStyle(target=document.documentElement,s=ME.settings){
  target.style.setProperty('--b-me',s.meBubble);
  target.style.setProperty('--b-me-text',s.meText);
  target.style.setProperty('--b-radius',s.radius+'px');
  target.style.setProperty('--m-font',FONTS[s.font]||FONTS.system);
  target.style.setProperty('--m-size',s.size+'px');
  target.style.setProperty('--m-weight',s.bold?'700':'400');
  target.style.setProperty('--m-style',s.italic?'italic':'normal');
  if(target===document.documentElement){
    // UI transparency + glass blur (customisable)
    const op=(s.uiOpacity??72)/100;
    target.style.setProperty('--ui-alpha',op);
    target.style.setProperty('--ui-blur',(s.uiBlur??14)+'px');
    // background covers the ENTIRE app (all pages), not just the chat area
    paintBg($('#bgLayer'),$('#bgDimEl'),s);
  }
}
